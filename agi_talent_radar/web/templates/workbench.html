<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AGI Talent Radar</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='workbench.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">AGI Talent Radar</div>
    <label for="import-file-input" id="import-file-button" class="import-button" title="上传 JSONL / Markdown / TXT 简历">导入简历</label>
    <input id="import-file-input" type="file" accept=".jsonl,.md,.txt" hidden>
  </header>

  <main class="workspace">
    <aside class="library" aria-label="人才库">
      <div class="import-progress hidden" id="import-progress">
        <div class="progress-pulse"></div>
        <span id="import-progress-text">正在解析上传文件…</span>
      </div>

      <section class="drawer is-open" data-group="pending" id="drawer-pending">
        <button class="drawer-toggle is-open" type="button" aria-expanded="true" aria-controls="list-pending">
          <span>待评价库</span>
          <span class="drawer-count" id="count-pending">0</span>
        </button>
        <div class="drawer-tools">
          <button class="bulk-evaluate-button" id="bulk-evaluate-pending" type="button" disabled>一键评估</button>
        </div>
        <div class="drawer-body" id="list-pending"></div>
      </section>

      <section class="drawer" data-group="shortlisted" id="drawer-shortlisted">
        <button class="drawer-toggle" type="button" aria-expanded="false" aria-controls="list-shortlisted">
          <span>优选库</span>
          <span class="drawer-count" id="count-shortlisted">0</span>
        </button>
        <div class="drawer-body" id="list-shortlisted" hidden></div>
      </section>

      <section class="drawer" data-group="alternative" id="drawer-alternative">
        <button class="drawer-toggle" type="button" aria-expanded="false" aria-controls="list-alternative">
          <span>备选库</span>
          <span class="drawer-count" id="count-alternative">0</span>
        </button>
        <div class="drawer-body" id="list-alternative" hidden></div>
      </section>

      <section class="drawer" data-group="rejected" id="drawer-rejected">
        <button class="drawer-toggle" type="button" aria-expanded="false" aria-controls="list-rejected">
          <span>不建议后续沟通</span>
          <span class="drawer-count" id="count-rejected">0</span>
        </button>
        <div class="drawer-body" id="list-rejected" hidden></div>
      </section>
    </aside>

    <section class="resume-pane" aria-label="简历原文" id="resume-pane">
      <div class="empty-state" id="empty-resume">
        <p>从左侧选择一位候选人</p>
        <p class="sub">导入简历后，候选人将按分组出现在左栏抽屉中</p>
      </div>
    </section>

    <section class="agent-pane" aria-label="Agent 评估区" id="agent-pane">
      <div class="empty-state" id="empty-agent">
        <p>Agent 评估区</p>
        <p class="sub">选择候选人并点击「开始评估」生成结构化结果</p>
      </div>
    </section>
  </main>

  <template id="candidate-card-template">
    <div class="candidate-card">
      <div class="card-name"></div>
      <div class="card-role"></div>
      <div class="card-meta">
        <span class="card-level"></span>
        <span class="card-category"></span>
      </div>
      <div class="card-actions">
        <button class="action-evaluate" type="button">评估</button>
        <button class="action-delete" type="button">删除</button>
      </div>
    </div>
  </template>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog class="confirm-dialog" id="bulk-confirm-dialog">
    <form method="dialog" class="confirm-dialog-content">
      <h2 id="bulk-confirm-title">确认评估待评价库</h2>
      <p id="bulk-confirm-message"></p>
      <div class="confirm-dialog-actions">
        <button type="button" class="confirm-cancel" id="bulk-confirm-cancel">取消</button>
        <button type="button" class="confirm-submit" id="bulk-confirm-submit">确认评估</button>
      </div>
    </form>
  </dialog>
  <script src="{{ url_for('static', filename='workbench.js') }}"></script>
</body>
</html>
