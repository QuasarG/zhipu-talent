{% extends "base.html" %}
{% set nav_active = '' %}
{% block title %}登录 · 智谱人才研究平台{% endblock %}

{% block body %}
<div class="login-wrap">
  <div class="login-card glass">
    <h1 class="login-title">智谱人才研究平台</h1>
    <p class="login-subtitle muted">内部人才研究、简历评估与知识管理工具</p>
    <form id="login-form" class="login-form">
      <label class="login-field">
        <span class="login-label">访问密码</span>
        <input type="password" name="password" required
               class="login-input" placeholder="请输入访问密码"
               autocomplete="current-password">
      </label>
      <button type="submit" class="login-submit">登录</button>
    </form>
    <p id="login-error" class="login-error" role="alert"></p>
  </div>
</div>

<style>
.login-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: calc(100vh - 80px);
  padding: var(--space-8);
}
.login-card {
  width: 100%;
  max-width: 400px;
  padding: var(--space-10) var(--space-8);
  border-radius: var(--radius-xl);
  text-align: center;
}
.login-title {
  font-size: var(--fs-2xl);
  margin-bottom: var(--space-2);
}
.login-subtitle {
  font-size: var(--fs-md);
  margin-bottom: var(--space-8);
}
.login-form {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  text-align: left;
}
.login-field {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}
.login-label {
  font-size: var(--fs-sm);
  color: var(--color-fg-secondary);
  font-weight: 500;
}
.login-input {
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border-strong);
  font-size: var(--fs-md);
  font-family: var(--font-body);
  background: rgba(255, 255, 255, 0.60);
  transition: border-color var(--transition-fast);
}
.login-input:focus {
  outline: none;
  border-color: var(--color-accent);
}
.login-submit {
  padding: var(--space-3) var(--space-6);
  border-radius: var(--radius-md);
  border: none;
  background: var(--color-accent);
  color: #fff;
  font-size: var(--fs-md);
  font-weight: 600;
  cursor: pointer;
  transition: background var(--transition-fast);
}
.login-submit:hover { background: var(--teal-500); }
.login-error {
  margin-top: var(--space-4);
  font-size: var(--fs-sm);
  color: var(--color-conflict);
  min-height: 1.2em;
}
</style>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const password = form.password.value;
  const errorEl = document.getElementById('login-error');
  errorEl.textContent = '';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password}),
    });
    if (res.ok) {
      const params = new URLSearchParams(location.search);
      const next = params.get('next') || '/';
      window.location.href = next;
    } else {
      const data = await res.json().catch(() => ({detail: '登录失败'}));
      errorEl.textContent = data.detail || '密码错误或未配置访问密码。';
    }
  } catch (err) {
    errorEl.textContent = '网络错误，请重试。';
  }
});
</script>
{% endblock %}
