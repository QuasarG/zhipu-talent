<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>人才库 · AGI Talent Radar</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='workbench.css') }}">
  <style>
    .pool-layout { display: flex; height: calc(100vh - 48px); }
    .pool-list { flex: 1; overflow-y: auto; padding: 16px; }
    .pool-detail { width: 420px; border-left: 1px solid var(--color-border); overflow-y: auto; padding: 16px; background: #fff; }
    .pool-toolbar { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
    .pool-toolbar select, .pool-toolbar input { padding: 6px 10px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); font-size: 13px; }
    .pool-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .pool-table th { text-align: left; padding: 8px 10px; background: var(--color-muted); position: sticky; top: 0; font-weight: 600; }
    .pool-table td { padding: 10px; border-bottom: 1px solid var(--color-border); }
    .pool-row { cursor: pointer; }
    .pool-row:hover { background: var(--accent-blue); }
    .pool-row.is-selected { background: var(--accent-lilac); }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
    .badge-red { background: var(--accent-rose); color: #B91C1C; border: 1px solid var(--accent-rose-border); }
    .badge-yellow { background: var(--accent-amber); color: #92700A; border: 1px solid var(--accent-amber-border); }
    .badge-green { background: var(--accent-mint); color: #1B7A4A; border: 1px solid var(--accent-mint-border); }
    .badge-pending { background: var(--color-muted); color: var(--accent-ink); }
    .pool-empty { text-align: center; color: #71717A; padding: 40px; }
    .detail-section { margin-bottom: 20px; }
    .detail-section h3 { font-size: 13px; color: var(--accent-ink); margin: 0 0 8px; border-bottom: 1px solid var(--color-border); padding-bottom: 4px; }
    .rep-event { padding: 8px; border-radius: var(--radius-sm); margin-bottom: 6px; font-size: 12px; }
    .rep-event-red { background: var(--accent-rose); }
    .rep-event-yellow { background: var(--accent-amber); }
    .rep-event-green { background: var(--accent-mint); }
    .rep-source { display: block; color: #6B7280; font-size: 11px; word-break: break-all; margin-top: 2px; }
    .review-form { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
    .review-form button { padding: 4px 10px; border-radius: var(--radius-sm); border: 1px solid var(--color-border); cursor: pointer; font-size: 12px; }
    .review-form .btn-confirm { background: var(--accent-rose); color: #B91C1C; border-color: var(--accent-rose-border); }
    .review-form .btn-dismiss { background: var(--accent-mint); color: #1B7A4A; border-color: var(--accent-mint-border); }
    .eval-item { padding: 6px 0; border-bottom: 1px dashed var(--color-border); font-size: 12px; }
    .back-link { color: var(--accent-ink); text-decoration: none; font-size: 13px; }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="/" class="back-link">← 返回工作台</a>
    <div class="brand" style="margin-left: 16px;">人才库</div>
  </header>

  <div class="pool-layout">
    <div class="pool-list">
      <div class="pool-toolbar">
        <select id="filter-type">
          <option value="">全部类型</option>
          <option value="guest">嘉宾</option>
          <option value="student">学生</option>
          <option value="social">社会人员</option>
        </select>
        <select id="filter-level">
          <option value="">全部舆情</option>
          <option value="red">🔴 红</option>
          <option value="yellow">🟡 黄</option>
          <option value="green">🟢 绿</option>
        </select>
        <input id="filter-name" type="text" placeholder="搜索姓名..." style="flex:1; min-width: 140px;">
      </div>
      <table class="pool-table">
        <thead>
          <tr>
            <th>姓名</th><th>类型</th><th>机构</th><th>方向</th><th>分数</th><th>舆情</th>
          </tr>
        </thead>
        <tbody id="pool-tbody">
          <tr><td colspan="6" class="pool-empty">加载中...</td></tr>
        </tbody>
      </table>
    </div>

    <aside class="pool-detail" id="pool-detail">
      <div class="pool-empty" id="detail-empty">从左侧选择一位人员查看详情</div>
    </aside>
  </div>

  <script>
    const LEVEL_BADGE = { red: 'badge-red', yellow: 'badge-yellow', green: 'badge-green' };
    const LEVEL_LABEL = { red: '🔴 红', yellow: '🟡 黄', green: '🟢 绿' };

    async function fetchJSON(url) {
      const resp = await fetch(url);
      if (!resp.ok) throw new Error(`${resp.status}`);
      return resp.json();
    }

    async function loadList() {
      const type = document.getElementById('filter-type').value;
      const level = document.getElementById('filter-level').value;
      const name = document.getElementById('filter-name').value.trim();
      const params = new URLSearchParams();
      if (type) params.set('person_type', type);
      if (level) params.set('level', level);
      if (name) params.set('name', name);
      const tbody = document.getElementById('pool-tbody');
      try {
        const rows = await fetchJSON('/api/persons?' + params);
        if (!rows.length) {
          tbody.innerHTML = '<tr><td colspan="6" class="pool-empty">无匹配人员</td></tr>';
          return;
        }
        tbody.innerHTML = rows.map(r => `
          <tr class="pool-row" data-id="${r.id}">
            <td>${r.name}</td>
            <td>${r.person_type}</td>
            <td>${r.org || '-'}</td>
            <td>${r.direction || '-'}</td>
            <td>${r.overall_score ?? '-'}</td>
            <td>${r.reputation_level ? `<span class="badge ${LEVEL_BADGE[r.reputation_level]||''}">${LEVEL_LABEL[r.reputation_level]||r.reputation_level}</span>` : '-'}</td>
          </tr>
        `).join('');
        tbody.querySelectorAll('.pool-row').forEach(row => {
          row.addEventListener('click', () => loadDetail(row.dataset.id, row));
        });
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="6" class="pool-empty">加载失败: ${e.message}</td></tr>`;
      }
    }

    async function loadDetail(id, rowEl) {
      document.querySelectorAll('.pool-row').forEach(r => r.classList.remove('is-selected'));
      if (rowEl) rowEl.classList.add('is-selected');
      const panel = document.getElementById('pool-detail');
      panel.innerHTML = '<div class="pool-empty">加载中...</div>';
      try {
        const data = await fetchJSON('/api/persons/' + id);
        const reps = (data.reputation_reports || []).map(r => {
          const events = (r.events || []).map(ev => `
            <div class="rep-event rep-event-${r.level}">
              <strong>[${ev.category||'未分类'}]</strong> ${ev.summary||''}
              <span style="color:#71717A"> (身份:${ev.identity_match||'?'}, 状态:${ev.status||'?'})</span>
              ${(ev.source_urls||[]).map(u => `<span class="rep-source">来源: ${u}</span>`).join('')}
            </div>`).join('');
          const reviewBtns = r.review_status === 'pending'
            ? `<div class="review-form">
                 <button class="btn-confirm" onclick="submitReview(${r.id},'confirmed')">确认风险</button>
                 <button class="btn-dismiss" onclick="submitReview(${r.id},'dismissed')">驳回误报</button>
               </div>`
            : `<p style="font-size:12px;color:#71717A">复核状态: ${r.review_status} ${r.reviewer ? '由 '+r.reviewer : ''}</p>`;
          return events + reviewBtns;
        }).join('');
        const evals = (data.evaluations || []).map(e => `
          <div class="eval-item">
            <strong>${e.overall_score ?? '-'}分</strong> (${e.level||'?'}) · ${e.tier||''}
            <div style="color:#71717A">${e.one_liner||''}</div>
          </div>`).join('');
        panel.innerHTML = `
          <div class="detail-section">
            <h3>${data.name}</h3>
            <p style="font-size:12px;color:#71717A">类型: ${data.person_type} | 机构: ${data.org||'-'} | 方向: ${data.direction||'-'}</p>
          </div>
          ${evals ? `<div class="detail-section"><h3>评估历史</h3>${evals}</div>` : ''}
          ${reps ? `<div class="detail-section"><h3>舆情报告</h3>${reps}</div>` : '<div class="detail-section"><h3>舆情报告</h3><p class="pool-empty">无</p></div>'}
        `;
      } catch (e) {
        panel.innerHTML = `<div class="pool-empty">加载失败: ${e.message}</div>`;
      }
    }

    async function submitReview(reportId, action) {
      const reviewer = prompt('复核人姓名（可选）:', '') || '';
      const note = prompt('复核备注（可选）:', '') || '';
      const resp = await fetch(`/api/reputation/${reportId}/review`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ action, reviewer, note }),
      });
      if (resp.ok) {
        alert(action === 'confirmed' ? '已确认风险' : '已驳回误报');
        loadList();
      } else {
        const err = await resp.json().catch(() => ({detail: resp.statusText}));
        alert('复核失败: ' + (err.detail || ''));
      }
    }

    document.getElementById('filter-type').addEventListener('change', loadList);
    document.getElementById('filter-level').addEventListener('change', loadList);
    document.getElementById('filter-name').addEventListener('input', loadList);
    loadList();
  </script>
</body>
</html>
