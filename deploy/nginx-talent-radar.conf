server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ── TLS 启用样例（公网部署强烈建议，登录凭据/API Key 不能明文裸奔）──
    # 1) 证书就位后注释掉上面两行 listen 80，改用：
    #    listen 443 ssl;
    #    listen [::]:443 ssl;
    #    http2 on;
    #    ssl_certificate     /etc/letsencrypt/live/<域名>/fullchain.pem;
    #    ssl_certificate_key /etc/letsencrypt/live/<域名>/privkey.pem;
    #    ssl_protocols TLSv1.2 TLSv1.3;
    # 2) 80 端口整站跳 https：
    #    server { listen 80 default_server; return 301 https://$host$request_uri; }
    # 3) certbot certonly --nginx -d <域名> 自动续期。

    client_max_body_size 220m;

    # assets 目录（字体/js/css，文件名带 hash）长期缓存
    location ^~ /static/dist/assets/ {
        proxy_pass http://127.0.0.1:8503;
        proxy_hide_header Cache-Control;
        proxy_ignore_headers Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 其他 static（index.html/favicon）每次拉新
    location /static/ {
        proxy_pass http://127.0.0.1:8503;
        proxy_hide_header Cache-Control;
        proxy_ignore_headers Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8503;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
